name: Validate
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  workload:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_USER: workshop
          POSTGRES_PASSWORD: local-demo-only
          POSTGRES_DB: workshop
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U workshop -d workshop"
          --health-interval 2s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: workload
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: workload/go.mod
          cache-dependency-path: workload/go.sum
      - name: Format, vet and durable race tests
        env:
          TEST_DATABASE_URL: postgres://workshop:local-demo-only@localhost:5432/workshop?sslmode=disable
        run: |
          test -z "$(gofmt -l cmd internal)"
          go vet ./...
          go test -race -count=1 ./...
      - name: Build and start local application
        env:
          APP_REVISION: ${{ github.sha }}
        run: docker compose -f compose.yaml -f compose.tracing.yaml --profile observability up --build -d
      - name: End-to-end HTTP and worker assertions
        run: python3 smoke.py
      - name: Evidence contract and measured local baseline
        env:
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          python3 -m pip install jsonschema==4.23.0 PyYAML==6.0.2
          python3 -m unittest discover -s evidence -v
          python3 -m unittest discover -s deploy -v
          python3 deploy/check_schemas.py
          python3 deploy/check_database_schema.py
          python3 evidence/check_api.py
          python3 evidence/record.py --revision "$SOURCE_REVISION" --output output/baseline.json
          python3 evidence/validate.py output/baseline.json
      - name: Correlated API/worker traces and bounded CPU/heap profiles
        env:
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          python3 evidence/trace_profile.py --revision "$SOURCE_REVISION"
          python3 evidence/check_trace_profile.py
          go tool pprof -top -nodecount=50 output/worker-cpu.pprof | tee output/worker-cpu-top.txt
          grep -q 'domain.Analyze' output/worker-cpu-top.txt
          go tool pprof -top -nodecount=15 output/worker-heap.pprof
      - name: Compiled regression and exact-image recovery
        env:
          SOURCE_REVISION: ${{ github.sha }}
          APP_REVISION: ${{ github.sha }}
        run: |
          python3 evidence/regression.py --revision "$SOURCE_REVISION"
          python3 evidence/validate_regression.py output/regression-recovery.json
          go tool pprof -top -nodecount=30 output/regressed-cpu.pprof
      - name: API replica continuity and real worker crash recovery
        env:
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          python3 evidence/replica_recovery.py --revision "$SOURCE_REVISION"
          python3 evidence/validate_replica_recovery.py output/replica-recovery.json
      - name: Missing collector must fail evidence without failing the workload
        # Regression/recovery completes first so all phases retain the collector.
        env:
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          docker compose -f compose.yaml -f compose.tracing.yaml --profile observability stop prometheus
          if python3 evidence/record.py --revision "$SOURCE_REVISION" --count 1 --output output/collector-outage.json; then
            echo "Evidence incorrectly passed with the collector stopped"
            exit 1
          fi
          python3 evidence/validate.py output/collector-outage.json
          python3 -c 'import json; r=json.load(open("output/collector-outage.json")); assert r["completed_jobs"] == 1 and r["golden_reports_match"] and r["telemetry"]["api_metrics"] and r["telemetry"]["worker_metrics"] and not r["telemetry"]["prometheus_targets"] and r["result"] == "failed"'
      - name: Retain local observations (not durable portfolio publication)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: local-observations
          path: |
            workload/output/*.json
            workload/output/*.pprof
            workload/output/*-top.txt
          retention-days: 30
      - name: Diagnostics and cleanup
        if: always()
        run: |
          docker compose -f compose.yaml -f compose.tracing.yaml -f compose.replicas.yaml --profile observability logs --no-color --tail=100
          docker compose -f compose.yaml -f compose.tracing.yaml -f compose.replicas.yaml --profile observability down --volumes
  terraform:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: 1.16.4
      - run: python3 -m pip install -r scripts/requirements-recovery.txt
      - run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - run: terraform fmt -check -recursive infrastructure bootstrap recovery
      - run: terraform -chdir=bootstrap/terraform init -input=false -lockfile=readonly
      - run: terraform -chdir=bootstrap/terraform validate
      - run: terraform -chdir=bootstrap/terraform test
      - run: terraform -chdir=infrastructure/lab init -input=false -lockfile=readonly
      - run: terraform -chdir=infrastructure/lab validate
      - run: terraform -chdir=infrastructure/lab test
      - run: terraform -chdir=recovery/terraform init -backend=false -input=false -lockfile=readonly
      - run: terraform -chdir=recovery/terraform validate
      - run: terraform -chdir=recovery/terraform test
      - name: Render disjoint Config Sync owners
        run: |
          python3 -m pip install PyYAML==6.0.2
          kubectl kustomize gitops/platform > /tmp/platform.yaml
          kubectl kustomize gitops/apps/report > /tmp/app.yaml
          python3 scripts/check-ownership.py
